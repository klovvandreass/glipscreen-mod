name: Android build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HAS_RELEASE_SIGNING: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Verify debug APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.glipscreen.mod'"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "application-label:'Klovv Screen'"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Prepare release signing key
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/klovv-release.jks"
          test -s "$RUNNER_TEMP/klovv-release.jks"
      - name: Build signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          KLOVV_KEYSTORE_FILE: ${{ runner.temp }}/klovv-release.jks
          KLOVV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KLOVV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KLOVV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Verify signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.glipscreen.mod'"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "application-label:'Klovv Screen'"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Explain release signing setup
        if: ${{ env.HAS_RELEASE_SIGNING != 'true' }}
        run: echo "Release APK not built: configure all four Android signing secrets in GitHub Settings > Secrets and variables > Actions."
      - uses: actions/upload-artifact@v4
        with:
          name: klovv-screen-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        with:
          name: klovv-screen-release-apk
          path: app/build/outputs/apk/release/app-release.apk
